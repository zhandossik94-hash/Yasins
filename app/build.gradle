plugins { id 'com.android.application' }

android {
    namespace 'com.aktobe.yasinlauncher'
    compileSdk 35
    defaultConfig {
        applicationId 'com.aktobe.yasinlauncher'
        minSdk 23
        targetSdk 28
        versionCode 2
        versionName '2.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
